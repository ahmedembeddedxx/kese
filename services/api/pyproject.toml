[project]
name = "mend-api"
version = "0.1.0"
description = "Mend backend: ephemeral tokens, detection, KB search, devices, events"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "google-genai>=0.3",
  "replicate>=1.0",
  "firebase-admin>=6.5",
  "python-multipart>=0.0.12",
  "slowapi>=0.1.9",
  "jsonschema>=4.23",
  "google-cloud-firestore>=2.19",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` as a default argument is the documented,
# idiomatic pattern, not the real bug this rule targets elsewhere.
ignore = ["B008"]
